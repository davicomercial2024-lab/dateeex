<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-label="Datex logo">

<defs>
  <linearGradient id="dxBlue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#25B6FF"/>
    <stop offset="45%" stop-color="#2F6BFF"/>
    <stop offset="100%" stop-color="#214BFF"/>
  </linearGradient>
  <linearGradient id="dxCyan" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#25F2FF"/>
    <stop offset="100%" stop-color="#0A83FF"/>
  </linearGradient>
  <linearGradient id="wordX" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#31F0FF"/>
    <stop offset="100%" stop-color="#1479FF"/>
  </linearGradient>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1400" height="500" fill="transparent"/>

